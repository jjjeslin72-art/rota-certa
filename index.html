<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota Certa</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{--c:#0f766e;--c2:#14b8a6;--bg:#f4f6f5;--card:#fff;--tx:#1f2937;--mut:#6b7280;--ok:#16a34a;--warn:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx)}
  header{background:var(--c);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
  header h1{margin:0;font-size:20px}
  header small{display:block;opacity:.85;font-size:12px}
  .lang button{background:transparent;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
  .lang button.on{background:#fff;color:var(--c);font-weight:700}
  main{max-width:640px;margin:0 auto;padding:12px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
  label{font-weight:700;font-size:15px;display:block;margin-bottom:6px}
  .hint{color:var(--mut);font-size:13px;margin:4px 0 8px}
  input[type=text],textarea{width:100%;font-size:16px;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-family:inherit}
  textarea{min-height:150px}
  .row{display:flex;gap:8px;align-items:center}
  .row input{flex:1}
  button{font-family:inherit;cursor:pointer}
  .btn{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700}
  .main-btn{width:100%;background:var(--c);color:#fff;font-size:18px;padding:16px}
  .main-btn:disabled{opacity:.6}
  .sub{background:#e6f4f2;color:var(--c)}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
  .chk input{width:20px;height:20px}
  #status{font-size:14px;color:var(--mut);margin-top:8px;white-space:pre-line}
  #status.err{color:var(--warn)}
  #map{height:300px;border-radius:14px;margin-bottom:12px}
  .sum{display:flex;justify-content:space-around;text-align:center}
  .sum b{display:block;font-size:22px;color:var(--c)}
  .sum span{font-size:13px;color:var(--mut)}
  .stop{display:flex;gap:10px;padding:12px 0;border-top:1px solid #eee}
  .stop:first-child{border-top:0}
  .num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .stop.done .num{background:var(--ok)}
  .stop.done .info{opacity:.5;text-decoration:line-through}
  .stop.next{background:#fff7e6;margin:0 -14px;padding:12px 14px;border-radius:10px}
  .stop.next .num{background:#f59e0b}
  .info{flex:1;min-width:0}
  .info .nm{font-weight:700;font-size:16px}
  .info .ad{font-size:14px;color:var(--mut);word-break:break-word}
  .info .lg{font-size:13px;color:var(--c);margin-top:2px}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .acts a,.acts button{font-size:14px;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700;border:0}
  .g{background:#1a73e8;color:#fff}.w{background:#33ccff;color:#05384a}.z{background:#25d366;color:#053}
  .d{background:#eee;color:#333}.stop.done .d{background:var(--ok);color:#fff}
  .fail{color:var(--warn);font-size:14px}
  .links a{display:block;margin-top:8px;text-align:center;background:#1a73e8;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:700}
  .hidden{display:none}
  footer{text-align:center;color:var(--mut);font-size:11px;padding:10px 0 30px}
  /* ---- 길안내 화면 ---- */
  #nav{position:fixed;inset:0;z-index:5000;background:#e5e7eb}
  #navmap{position:absolute;inset:0}
  .nb{position:absolute;top:10px;left:10px;right:10px;background:#0b5f56;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px #0005;z-index:2}
  .nb-ic{flex:0 0 64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:42px}
  .nb-d{font-size:34px;font-weight:800;line-height:1.05}
  .nb-t{font-size:18px;font-weight:600;opacity:.95;line-height:1.25}
  .lanes{position:absolute;left:10px;right:10px;background:#083f3a;border-radius:0 0 14px 14px;display:flex;justify-content:center;gap:6px;padding:6px 8px;z-index:1}
  .lanes:empty{display:none}
  .lane{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#ffffff14}
  .lane.on{background:#ef4444}
  .lane svg{width:26px;height:26px}
  .lane:not(.on) svg{opacity:.45}
  .nthen{position:absolute;left:10px;background:#083f3a;color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;z-index:1}
  .nthen:empty{display:none}
  .spd{position:absolute;left:12px;bottom:110px;width:74px;height:74px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
  .spd b{font-size:26px;line-height:1}.spd span{font-size:12px;color:#555}
  .nmsg{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;background:#111c;color:#fff;padding:8px 14px;border-radius:20px;font-size:15px;z-index:2}
  .nmsg:empty{display:none}
  .nbot{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:14px 16px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 12px #0003;z-index:2}
  .nbot button{width:58px;height:58px;border-radius:50%;border:2px solid #ddd;background:#fff;font-size:24px}
  .eta{text-align:center}
  .eta b{display:block;font-size:28px;color:#15803d}
  .eta span{font-size:16px;color:#555}
  #nArrive{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:5}
  #nArrive .box{background:#fff;border-radius:18px;padding:22px;width:86%;max-width:380px;text-align:center}
  #nArrive h2{margin:6px 0 4px;font-size:24px}
  #nArrive p{color:#555;margin:0 0 16px}
  #nArrive button{width:100%;margin-top:8px}
  .nomap #navmap{display:none}
  .n{background:#0f766e;color:#fff}
  .navbtns{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<header>
  <div><h1>🚚 Rota Certa</h1><small data-t="tag"></small></div>
  <div class="lang"><button id="lk">한국어</button> <button id="lp">PT</button></div>
</header>

<main>
  <section class="card">
    <label data-t="start"></label>
    <div class="row">
      <input type="text" id="start" data-ph="startPh">
      <button class="btn sub" id="gps">📍</button>
    </div>
    <div class="hint" data-t="gpsHint"></div>
  </section>

  <section class="card">
    <label data-t="stops"></label>
    <div class="hint" data-t="stopsHint"></div>
    <textarea id="stops" data-ph="stopsPh"></textarea>
    <label class="chk"><input type="checkbox" id="round"> <span data-t="round"></span></label>
  </section>

  <button class="btn main-btn" id="go" data-t="go"></button>
  <div id="status"></div>

  <section id="result" class="hidden" style="margin-top:12px">
    <div class="card sum">
      <div><b id="sStops">0</b><span data-t="sStops"></span></div>
      <div><b id="sKm">0</b><span>km</span></div>
      <div><b id="sTime">0</b><span data-t="sTime"></span></div>
    </div>
    <div id="map"></div>
    <div class="card navbtns"><button class="btn main-btn" id="navNext" data-t="navNext"></button><button class="btn sub" id="simNext" data-t="sim"></button></div>
    <div class="card"><div id="list"></div></div>
    <div class="card links">
      <label data-t="allRoute"></label>
      <div class="hint" data-t="allHint"></div>
      <div id="chunks"></div>
    </div>
    <button class="btn sub" style="width:100%" id="reset" data-t="reset"></button>
  </section>
  <footer>Mapa © OpenStreetMap · Rotas: OSRM</footer>
</main>

<div id="nav" class="hidden">
  <div id="navmap"></div>
  <div class="nb"><div class="nb-ic" id="nIcon"></div><div style="min-width:0"><div class="nb-d" id="nDist"></div><div class="nb-t" id="nText"></div></div></div>
  <div class="lanes" id="nLanes"></div>
  <div class="nthen" id="nThen"></div>
  <div class="spd"><b id="nSpd">0</b><span>km/h</span></div>
  <div class="nmsg" id="nMsg"></div>
  <div class="nbot">
    <button id="nEnd" aria-label="end">✕</button>
    <div class="eta"><b id="nEta">--</b><span id="nRem"></span></div>
    <button id="nVoice" aria-label="voice">🔊</button>
  </div>
  <div id="nArrive" class="hidden"><div class="box">
    <div style="font-size:48px">🏁</div><h2 data-t="arrived"></h2><p id="nArrName"></p>
    <button class="btn main-btn" id="nDoneNext" data-t="doneNext"></button>
    <button class="btn sub" id="nClose" data-t="close"></button>
  </div></div>
</div>

<script>
const T={
 ko:{tag:"여러 곳 배송, 가장 빠른 순서로",start:"출발지",startPh:"예: Rua José Paulino, 500, São Paulo",gpsHint:"📍 버튼을 누르면 지금 있는 곳이 출발지가 돼요",
  stops:"배송할 곳",stopsHint:"한 줄에 한 곳씩 써 주세요. 이름과 전화번호는 | 로 나눠서 넣을 수 있어요.\n예: Rua Augusta, 1500, São Paulo | 마리아 | 11 98765-4321",
  stopsPh:"Rua Augusta, 1500, São Paulo | Maria | 11 98765-4321\nAv. Paulista, 1000, São Paulo",round:"마지막에 출발지로 돌아오기",
  go:"🧭 가장 빠른 순서 만들기",sStops:"곳",sTime:"예상 시간",allRoute:"전체 경로 한 번에 열기",allHint:"구글지도는 한 번에 10곳까지만 돼서 나눠서 열어요",
  reset:"새 경로 만들기",nav:"구글지도",waze:"Waze",wa:"왓츠앱",done:"완료",undo:"완료 취소",part:"구간",
  finding:"주소 찾는 중",routing:"가장 빠른 순서 계산 중...",notFound:"이 주소는 못 찾았어요 (빼고 계산했어요):",
  needStart:"출발지를 넣어 주세요",needStops:"배송할 곳을 1곳 이상 넣어 주세요",startFail:"출발지 주소를 못 찾았어요. 동네 이름이나 도시를 같이 써 보세요",
  netErr:"인터넷 연결이나 지도 서버에 문제가 있어요. 잠시 후 다시 해 주세요",gpsFail:"위치를 가져오지 못했어요. 주소를 직접 써 주세요",
  myLoc:"내 현재 위치",backHome:"출발지로 돌아오기",min:"분",h:"시간",
  allDone:"🎉 오늘 배송 끝! 수고하셨어요"},
 pt:{tag:"Várias entregas, na ordem mais rápida",start:"Ponto de partida",startPh:"Ex: Rua José Paulino, 500, São Paulo",gpsHint:"Toque em 📍 para usar sua localização atual",
  stops:"Entregas",stopsHint:"Um endereço por linha. Nome e telefone podem vir depois de |\nEx: Rua Augusta, 1500, São Paulo | Maria | 11 98765-4321",
  stopsPh:"Rua Augusta, 1500, São Paulo | Maria | 11 98765-4321\nAv. Paulista, 1000, São Paulo",round:"Voltar ao ponto de partida no final",
  go:"🧭 Criar a rota mais rápida",sStops:"entregas",sTime:"tempo estimado",allRoute:"Abrir a rota completa",allHint:"O Google Maps aceita até 10 paradas por vez, por isso dividimos",
  reset:"Nova rota",nav:"Google Maps",waze:"Waze",wa:"WhatsApp",done:"Entregue",undo:"Desfazer",part:"Parte",
  finding:"Buscando endereços",routing:"Calculando a ordem mais rápida...",notFound:"Não encontramos estes endereços (ficaram fora da rota):",
  needStart:"Informe o ponto de partida",needStops:"Informe pelo menos 1 entrega",startFail:"Não encontramos o ponto de partida. Tente incluir bairro ou cidade",
  netErr:"Problema de conexão ou no servidor de mapas. Tente de novo em instantes",gpsFail:"Não foi possível obter a localização. Digite o endereço",
  myLoc:"Minha localização",backHome:"Voltar ao início",min:"min",h:"h",
  allDone:"🎉 Todas as entregas feitas! Bom trabalho"}
};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("rc_lang","ko");
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyLang(){
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("lk").classList.toggle("on",lang==="ko");$("lp").classList.toggle("on",lang==="pt");
  document.documentElement.lang=lang==="ko"?"ko":"pt-BR";
  if(trip)render();
}
$("lk").onclick=()=>{lang="ko";store.set("rc_lang",lang);applyLang()};
$("lp").onclick=()=>{lang="pt";store.set("rc_lang",lang);applyLang()};

function status(msg,err){const s=$("status");s.textContent=msg||"";s.className=err?"err":""}

// ---- 위치 ----
let startCoord=null; // GPS로 잡은 출발지
$("gps").onclick=()=>{
  if(!navigator.geolocation){status(t("gpsFail"),1);return}
  navigator.geolocation.getCurrentPosition(p=>{
    startCoord={lat:p.coords.latitude,lon:p.coords.longitude};
    $("start").value=t("myLoc");status("");
  },()=>status(t("gpsFail"),1),{enableHighAccuracy:true,timeout:15000});
};
$("start").addEventListener("input",()=>{startCoord=null});

// ---- 주소 → 좌표 (OpenStreetMap Nominatim, 1초에 1번 규칙) ----
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const geoCache=store.get("rc_geo2",{});
let lastGeo=0;
const SP={lat:-23.55,lon:-46.63}; // 기본 기준점: 상파울루
async function geoOnce(q,near){
  const key=q.trim().toLowerCase()+(near?"@"+near.lat.toFixed(1)+","+near.lon.toFixed(1):"");
  if(geoCache[key])return geoCache[key];
  const wait=1100-(Date.now()-lastGeo); if(wait>0)await sleep(wait);
  lastGeo=Date.now();
  let url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&accept-language=pt-BR&q="+encodeURIComponent(q);
  if(near){const d=0.6;url+=`&bounded=1&viewbox=${near.lon-d},${near.lat+d},${near.lon+d},${near.lat-d}`}
  const r=await fetch(url,{headers:{"Accept":"application/json"}});
  if(!r.ok)throw new Error("geo");
  const j=await r.json();
  if(!j.length)return null;
  const v={lat:+j[0].lat,lon:+j[0].lon,found:j[0].display_name};
  geoCache[key]=v;store.set("rc_geo2",geoCache);
  return v;
}
// 가까운 곳(약 60km 안)에서 먼저 찾고, 없으면 브라질 전체에서 찾기
async function geocode(q,near){
  return (await geoOnce(q,near||SP))||(await geoOnce(q,null));
}

function parseLine(line){
  const [addr,name,phone]=line.split("|").map(s=>(s||"").trim());
  return {addr,name,phone};
}
function waNumber(p){
  let d=(p||"").replace(/\D/g,"");
  if(!d)return "";
  if(d.length<=11)d="55"+d;
  return d;
}

// ---- 최적 순서 (OSRM) ----
const OSRM="https://router.project-osrm.org";
const cs=pts=>pts.map(p=>p.lon.toFixed(6)+","+p.lat.toFixed(6)).join(";");

let trip=store.get("rc_trip",null);
let map,layer;

$("go").onclick=async()=>{
  const startTxt=$("start").value.trim();
  const lines=$("stops").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!startTxt){status(t("needStart"),1);return}
  if(!lines.length){status(t("needStops"),1);return}
  $("go").disabled=true;
  try{
    let start=startCoord;
    if(!start&&(startTxt===T.ko.myLoc||startTxt===T.pt.myLoc)){status(t("gpsHint"),1);return}
    if(!start){status(t("finding")+"...");start=await geocode(startTxt);if(!start){status(t("startFail"),1);return}}
    const stops=[],fails=[];
    for(let i=0;i<lines.length;i++){
      status(`${t("finding")} ${i+1}/${lines.length}...`);
      const s=parseLine(lines[i]);
      const c=await geocode(s.addr,start);
      if(c)stops.push({...s,...c});else fails.push(s.addr);
    }
    if(!stops.length){status(t("notFound")+"\n"+fails.join("\n"),1);return}
    status(t("routing"));
    const round=$("round").checked;
    const all=[{addr:startTxt,lat:start.lat,lon:start.lon,isStart:true},...stops];
    // 1) 순서 정하기
    let order=all.map((_,i)=>i);
    if(all.length>2){
      const r=await fetch(`${OSRM}/trip/v1/driving/${cs(all)}?source=first&roundtrip=true&overview=false`);
      const j=await r.json(); if(j.code!=="Ok")throw new Error("trip");
      order=j.waypoints.map((w,i)=>({i,pos:w.waypoint_index})).sort((a,b)=>a.pos-b.pos).map(x=>x.i);
      if(!round){ // 돌아오지 않을 때: 한 바퀴 순서에서 가는 방향을 더 짧은 쪽으로
        const rev=[order[0],...order.slice(1).reverse()];
        order=await shorter(all,order,rev);
      }
    }
    let seq=order.map(i=>all[i]);
    if(round)seq=[...seq,{...all[0],isEnd:true}];
    // 2) 실제 도로 경로
    const r2=await fetch(`${OSRM}/route/v1/driving/${cs(seq)}?overview=full&geometries=geojson`);
    const j2=await r2.json(); if(j2.code!=="Ok")throw new Error("route");
    const rt=j2.routes[0];
    trip={start:seq[0],stops:seq.slice(1).map((s,k)=>({...s,dist:rt.legs[k].distance,dur:rt.legs[k].duration,done:false})),
      dist:rt.distance,dur:rt.duration,line:rt.geometry.coordinates,fails};
    store.set("rc_trip",trip);
    status(fails.length?t("notFound")+"\n"+fails.join("\n"):"",fails.length>0);
    render();
    $("result").scrollIntoView({behavior:"smooth"});
  }catch(e){console.error(e);status(t("netErr"),1)}
  finally{$("go").disabled=false}
};

async function shorter(all,a,b){
  try{
    const [r1,r2]=await Promise.all([a,b].map(o=>fetch(`${OSRM}/route/v1/driving/${cs(o.map(i=>all[i]))}?overview=false`).then(r=>r.json())));
    return r2.routes[0].duration<r1.routes[0].duration?b:a;
  }catch(e){return a}
}

// ---- 화면 ----
function fmtTime(s){const m=Math.round(s/60);if(m<60)return m+" "+t("min");return Math.floor(m/60)+t("h")+" "+(m%60)+t("min")}
const gUrl=s=>`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`;
const wUrl=s=>`https://waze.com/ul?ll=${s.lat},${s.lon}&navigate=yes`;

function render(){
  if(!trip)return;
  $("result").classList.remove("hidden");
  const real=trip.stops.filter(s=>!s.isEnd);
  $("sStops").textContent=real.length;
  $("sKm").textContent=(trip.dist/1000).toFixed(1);
  $("sTime").textContent=fmtTime(trip.dur);
  const nextIdx=trip.stops.findIndex(s=>!s.done);
  let html="";
  trip.stops.forEach((s,i)=>{
    const cls=["stop",s.done?"done":"",i===nextIdx?"next":""].join(" ");
    const nm=s.isEnd?"🏠 "+t("backHome"):esc(s.name||s.addr);
    const wa=waNumber(s.phone);
    html+=`<div class="${cls}"><div class="num">${s.isEnd?"🏠":i+1}</div><div class="info">
      <div class="nm">${nm}</div>${(s.name&&!s.isEnd)?`<div class="ad">${esc(s.addr)}</div>`:""}
      ${(s.found&&!s.isEnd)?`<div class="ad">📍 ${esc(s.found.split(",").slice(0,4).join(","))}</div>`:""}
      ${s.phone?`<div class="ad">📞 ${esc(s.phone)}</div>`:""}
      <div class="lg">+ ${(s.dist/1000).toFixed(1)} km · ${fmtTime(s.dur)}</div>
      <div class="acts">${s.done?"":`<button class="n" data-n="${i}">${NT[lang].navStart}</button>`}<a class="g" href="${gUrl(s)}" target="_blank" rel="noopener">${t("nav")}</a>
      <a class="w" href="${wUrl(s)}" target="_blank" rel="noopener">${t("waze")}</a>
      ${wa?`<a class="z" href="https://wa.me/${wa}" target="_blank" rel="noopener">${t("wa")}</a>`:""}
      <button class="d" data-i="${i}">${s.done?t("undo"):"✓ "+t("done")}</button></div></div></div>`;
  });
  if(nextIdx===-1)html=`<div style="text-align:center;font-weight:700;padding:10px;color:var(--ok)">${t("allDone")}</div>`+html;
  $("list").innerHTML=html;
  $("list").querySelectorAll("button.n").forEach(b=>b.onclick=()=>startNav(+b.dataset.n,false));
  const nx=trip.stops.findIndex(s=>!s.done);
  $("navNext").style.display=$("simNext").style.display=nx<0?"none":"";
  $("navNext").onclick=()=>startNav(nx,false);$("simNext").onclick=()=>startNav(nx,true);
  $("list").querySelectorAll("button.d").forEach(b=>b.onclick=()=>{const s=trip.stops[+b.dataset.i];s.done=!s.done;store.set("rc_trip",trip);render()});
  // 10곳씩 나눠서 구글지도 링크
  const pts=[trip.start,...trip.stops];let ch="",k=1;
  for(let i=0;i<pts.length-1;i+=10){
    const part=pts.slice(i,i+11),o=part[0],d=part[part.length-1],w=part.slice(1,-1);
    let u=`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lon}&destination=${d.lat},${d.lon}&travelmode=driving`;
    if(w.length)u+="&waypoints="+encodeURIComponent(w.map(p=>p.lat+","+p.lon).join("|"));
    const a=i+1,b=Math.min(i+10,pts.length-1);
    ch+=`<a href="${u}" target="_blank" rel="noopener">${t("part")} ${k++}: ${a} → ${b}</a>`;
  }
  $("chunks").innerHTML=ch;
  drawMap(nextIdx);
}

function drawMap(nextIdx){
  if(typeof L==="undefined")return;
  if(!map){map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map)}
  if(layer)layer.remove();
  layer=L.layerGroup().addTo(map);
  const line=L.polyline(trip.line.map(c=>[c[1],c[0]]),{color:"#0f766e",weight:5,opacity:.8}).addTo(layer);
  const pin=(txt,bg)=>L.divIcon({className:"",html:`<div style="background:${bg};color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #fff;box-shadow:0 1px 4px #0006">${txt}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
  L.marker([trip.start.lat,trip.start.lon],{icon:pin("S","#111")}).addTo(layer);
  trip.stops.forEach((s,i)=>{if(s.isEnd)return;
    const bg=s.done?"#16a34a":(i===nextIdx?"#f59e0b":"#0f766e");
    L.marker([s.lat,s.lon],{icon:pin(i+1,bg)}).bindPopup(esc(s.name||s.addr)).addTo(layer)});
  map.fitBounds(line.getBounds(),{padding:[20,20]});
  setTimeout(()=>map.invalidateSize(),200);
}

$("reset").onclick=()=>{trip=null;store.set("rc_trip",null);$("result").classList.add("hidden");status("");window.scrollTo({top:0,behavior:"smooth"})};


// ===================== 길안내 화면 =====================
const NT={
 ko:{arrived:"도착했어요!",doneNext:"✓ 완료하고 다음 곳 안내",close:"닫기",navStart:"▶ 안내",navNext:"▶ 다음 곳 안내 시작",sim:"🎬 모의 주행으로 미리보기",
  reroute:"경로를 다시 찾는 중...",noGps:"GPS를 기다리는 중... 위치 허용을 눌러 주세요",simOn:"모의 주행 중",then:"그다음",ahead:"앞",now:"곧",
  left:"좌회전",right:"우회전","slight left":"왼쪽 방향","slight right":"오른쪽 방향","sharp left":"급좌회전","sharp right":"급우회전",uturn:"유턴",straight:"직진",
  arrive:"목적지 도착",depart:"출발",offRamp:"출구로 나가기",onRamp:"진입로로 들어가기",merge:"합류하기",fork:"갈림길",keepL:"왼쪽 길 유지",keepR:"오른쪽 길 유지",
  round:n=>`회전교차로에서 ${n}번째 출구`,on:"",m:"미터",km:"킬로미터",inX:d=>`${d} 앞에서`,allDone:"모든 배송이 끝났어요"},
 pt:{arrived:"Você chegou!",doneNext:"✓ Entregue, ir para a próxima",close:"Fechar",navStart:"▶ Navegar",navNext:"▶ Navegar até a próxima",sim:"🎬 Ver simulação",
  reroute:"Recalculando a rota...",noGps:"Aguardando GPS... permita a localização",simOn:"Simulação",then:"Depois",ahead:"",now:"Agora",
  left:"Vire à esquerda",right:"Vire à direita","slight left":"Mantenha-se à esquerda","slight right":"Mantenha-se à direita","sharp left":"Curva fechada à esquerda","sharp right":"Curva fechada à direita",uturn:"Faça o retorno",straight:"Siga em frente",
  arrive:"Destino",depart:"Siga",offRamp:"Pegue a saída",onRamp:"Entre na rampa",merge:"Entre na via",fork:"Bifurcação",keepL:"Mantenha-se à esquerda",keepR:"Mantenha-se à direita",
  round:n=>`Na rotatória, pegue a ${n}ª saída`,on:"",m:"metros",km:"quilômetros",inX:d=>`Em ${d},`,allDone:"Todas as entregas concluídas"}
};
Object.keys(NT).forEach(l=>Object.assign(T[l],{arrived:NT[l].arrived,doneNext:NT[l].doneNext,close:NT[l].close,navNext:NT[l].navNext,sim:NT[l].sim}));
const nt=k=>NT[lang][k];

// 화살표 아이콘
const ANG={straight:0,"slight right":40,right:90,"sharp right":135,uturn:180,"sharp left":-135,left:-90,"slight left":-40};
function arrowSvg(angle,color="#fff",size=56){
  if(angle===180)return `<svg width="${size}" height="${size}" viewBox="0 0 48 48"><path d="M30 42V20a8 8 0 0 0-16 0v6" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/><path d="M6 24l8 9 8-9" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48"><g transform="rotate(${angle} 24 30)"><path d="M24 44V10" stroke="${color}" stroke-width="6" stroke-linecap="round"/><path d="M12 21L24 8l12 13" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
}
function stepIcon(st){
  const m=st.maneuver;
  if(m.type==="arrive")return "🏁";
  if(m.type==="roundabout"||m.type==="rotary"||m.type==="roundabout turn")return `<svg width="56" height="56" viewBox="0 0 48 48"><circle cx="24" cy="24" r="10" fill="none" stroke="#fff" stroke-width="5"/><path d="M24 14V4M18 6l6-4 6 4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>`;
  return arrowSvg(ANG[m.modifier]??0);
}
function stepText(st){
  const m=st.maneuver,mod=m.modifier,name=st.name||st.ref||"";
  const nm=name?(lang==="ko"?` · ${name}`:` na ${name}`):"";
  switch(m.type){
    case "arrive":return nt("arrive");
    case "depart":return nt("depart")+(name?(lang==="ko"?` · ${name}`:` pela ${name}`):"");
    case "roundabout":case "rotary":case "roundabout turn":return nt("round")(m.exit||1)+nm;
    case "off ramp":return nt("offRamp")+nm;
    case "on ramp":return (mod&&mod.includes("left")?nt("keepL"):mod&&mod.includes("right")?nt("keepR"):nt("onRamp"))+nm;
    case "fork":return (mod&&mod.includes("left")?nt("keepL"):nt("keepR"))+nm;
    case "merge":return nt("merge")+nm;
    default:return (nt(mod)||nt("straight"))+nm;
  }
}
function fmtDist(m){return m<1000?(Math.max(10,Math.round(m/10)*10))+" m":(m/1000).toFixed(1)+" km"}
function sayDist(m){return m<1000?Math.round(m/50)*50+" "+nt("m"):(m/1000).toFixed(1)+" "+nt("km")}

// 거리 계산 (미터)
function toXY(lat,lon,o){return [(lon-o.lon)*Math.cos(o.lat*Math.PI/180)*111320,(lat-o.lat)*110540]}
function hav(a,b){const x=toXY(b.lat,b.lon,a);return Math.hypot(x[0],x[1])}
function bearingOf(a,b){const y=Math.sin((b.lon-a.lon)*Math.PI/180)*Math.cos(b.lat*Math.PI/180);const x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lon-a.lon)*Math.PI/180);return (Math.atan2(y,x)*180/Math.PI+360)%360}

let nav=null,nmap=null,nmarker=null,voiceOn=store.get("rc_voice",true),wakeLock=null;

async function fetchNavRoute(o,d){
  const r=await fetch(`${OSRM}/route/v1/driving/${o.lon.toFixed(6)},${o.lat.toFixed(6)};${d.lon.toFixed(6)},${d.lat.toFixed(6)}?overview=full&geometries=geojson&steps=true`);
  const j=await r.json(); if(j.code!=="Ok")throw new Error("route");
  const rt=j.routes[0],steps=rt.legs[0].steps,pts=[];let cum=0;
  steps.forEach((s,k)=>{
    s.startCum=cum;
    s.geometry.coordinates.forEach((c,ci)=>{
      const p={lat:c[1],lon:c[0],step:k};
      if(pts.length){const last=pts[pts.length-1];if(ci===0&&last.lat===p.lat&&last.lon===p.lon){return}cum+=hav(last,p)}
      p.cum=cum;pts.push(p);
    });
  });
  steps.forEach((s,k)=>s.endCum=k+1<steps.length?steps[k+1].startCum:cum);
  return {pts,steps,total:cum,duration:rt.duration,line:rt.geometry.coordinates};
}

function project(pos){
  const P=nav.r.pts;let best={d:1e9};
  for(let i=0;i<P.length-1;i++){
    const a=P[i],b=P[i+1],B=toXY(b.lat,b.lon,a),Q=toXY(pos.lat,pos.lon,a);
    const L2=B[0]*B[0]+B[1]*B[1];let t=L2?(Q[0]*B[0]+Q[1]*B[1])/L2:0;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(Q[0]-t*B[0],Q[1]-t*B[1]);
    if(d<best.d)best={d,i,cum:a.cum+t*(b.cum-a.cum),lat:a.lat+t*(b.lat-a.lat),lon:a.lon+t*(b.lon-a.lon),brg:bearingOf(a,b)};
  }
  return best;
}
function pointAt(cum){
  const P=nav.r.pts;
  for(let i=0;i<P.length-1;i++){if(P[i+1].cum>=cum){const a=P[i],b=P[i+1],t=(cum-a.cum)/((b.cum-a.cum)||1);return {lat:a.lat+t*(b.lat-a.lat),lon:a.lon+t*(b.lon-a.lon)}}}
  return P[P.length-1];
}

function speak(txt){
  if(!voiceOn||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=lang==="ko"?"ko-KR":"pt-BR";speechSynthesis.speak(u)}catch(e){}
}

function initNavMap(center){
  if(typeof maplibregl==="undefined"){$("nav").classList.add("nomap");return}
  if(nmap){nmap.resize();return}
  try{
    nmap=new maplibregl.Map({container:"navmap",style:"https://tiles.openfreemap.org/styles/liberty",center:[center.lon,center.lat],zoom:16.5,pitch:60,attributionControl:{compact:true}});
    nmap.on("load",()=>{
      nmap.addSource("route",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:nav?nav.r.line:[]}}});
      nmap.addLayer({id:"route-case",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#1e3a8a","line-width":13}});
      nmap.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#3b82f6","line-width":8}});
    });
    const el=document.createElement("div");
    el.innerHTML=`<svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fff" opacity=".9"/><path d="M22 6l11 28-11-6-11 6z" fill="#2563eb" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
    nmarker=new maplibregl.Marker({element:el,rotationAlignment:"map",pitchAlignment:"map"}).setLngLat([center.lon,center.lat]).addTo(nmap);
  }catch(e){console.error(e);$("nav").classList.add("nomap")}
}
function setRouteOnMap(){
  if(!nmap)return;
  const src=nmap.getSource&&nmap.getSource("route");
  if(src)src.setData({type:"Feature",geometry:{type:"LineString",coordinates:nav.r.line}});
}

function getPos(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:5000});
  });
}

async function startNav(i,sim){
  const dest=trip.stops[i];if(!dest)return;
  const prev=i>0?trip.stops[i-1]:trip.start;
  $("nav").classList.remove("hidden");$("nArrive").classList.add("hidden");
  $("nMsg").textContent=sim?"":nt("noGps");
  let origin=sim?prev:(await getPos())||prev;
  try{
    nav={i,dest,sim,r:await fetchNavRoute(origin,dest),said:{},off:0,lastReroute:0,lastPos:null,lastT:0,simCum:0};
  }catch(e){$("nMsg").textContent=t("netErr");return}
  $("nMsg").textContent=sim?nt("simOn"):"";
  initNavMap(origin);setRouteOnMap();
  try{if("wakeLock" in navigator)wakeLock=await navigator.wakeLock.request("screen")}catch(e){}
  if(sim){
    nav.timer=setInterval(()=>{nav.simCum+=14;const p=pointAt(nav.simCum);onPos(p,50)},1000);
    onPos(origin,0);
  }else{
    nav.watch=navigator.geolocation.watchPosition(p=>onPos({lat:p.coords.latitude,lon:p.coords.longitude},p.coords.speed!=null?p.coords.speed*3.6:null),
      ()=>{$("nMsg").textContent=nt("noGps")},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
    onPos(origin,null);
  }
}

function stopNav(){
  if(!nav)return;
  if(nav.timer)clearInterval(nav.timer);
  if(nav.watch!=null)navigator.geolocation.clearWatch(nav.watch);
  try{wakeLock&&wakeLock.release()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  nav=null;
}

async function reroute(pos){
  if(Date.now()-nav.lastReroute<8000)return;
  nav.lastReroute=Date.now();nav.off=0;
  $("nMsg").textContent=nt("reroute");speak(nt("reroute").replace("...",""));
  try{nav.r=await fetchNavRoute(pos,nav.dest);nav.said={};setRouteOnMap();$("nMsg").textContent=""}catch(e){$("nMsg").textContent=t("netErr")}
}

function onPos(pos,kmh){
  if(!nav||!nav.r)return;
  const now=Date.now();
  if(kmh==null&&nav.lastPos&&nav.lastT){const dt=(now-nav.lastT)/1000;if(dt>0)kmh=hav(nav.lastPos,pos)/dt*3.6}
  nav.lastPos=pos;nav.lastT=now;
  $("nSpd").textContent=Math.max(0,Math.round(kmh||0));
  const pr=project(pos);
  if(!nav.sim&&$("nMsg").textContent===nt("noGps"))$("nMsg").textContent="";
  // 경로 이탈 → 다시 찾기
  if(!nav.sim&&pr.d>55){if(++nav.off>=3){reroute(pos);}}else nav.off=0;
  const R=nav.r,remain=Math.max(0,R.total-pr.cum);
  // 도착
  if(remain<35){arrive();return}
  const sIdx=R.pts[pr.i].step,next=R.steps[sIdx+1]||R.steps[R.steps.length-1];
  const toMan=Math.max(0,R.steps[sIdx].endCum-pr.cum);
  $("nIcon").innerHTML=stepIcon(next);
  $("nDist").textContent=fmtDist(toMan);
  $("nText").textContent=stepText(next);
  // 차선
  const lanes=(next.intersections&&next.intersections[0]&&next.intersections[0].lanes)||[];
  $("nLanes").innerHTML=lanes.length>1?lanes.map(l=>`<div class="lane ${l.valid?"on":""}">${arrowSvg(ANG[(l.indications||["straight"])[0]]??0,"#fff",26)}</div>`).join(""):"";
  // 그다음 안내 (가까우면)
  const after=R.steps[sIdx+2];
  $("nThen").textContent=(after&&next.maneuver.type!=="arrive"&&(after.startCum-R.steps[sIdx+1].startCum)<250)?`${nt("then")}: ${stepText(after)}`:"";
  placeInfo();
  // 남은 시간·거리
  const secs=R.duration*(remain/(R.total||1));
  const eta=new Date(Date.now()+secs*1000);
  $("nEta").textContent=fmtTime(secs);
  $("nRem").textContent=`${(remain/1000).toFixed(1)} km · ${eta.toLocaleTimeString(lang==="ko"?"ko-KR":"pt-BR",{hour:"2-digit",minute:"2-digit"})}`;
  // 음성
  const far=(kmh||0)>70?800:300,key=sIdx+1;
  if(toMan<=far&&toMan>120&&!nav.said[key+"f"]){nav.said[key+"f"]=1;speak(lang==="ko"?`${sayDist(toMan)} 앞에서 ${stepText(next)}`:`${nt("inX")(sayDist(toMan))} ${stepText(next)}`)}
  if(toMan<=60&&!nav.said[key+"n"]){nav.said[key+"n"]=1;speak(lang==="ko"?`곧 ${stepText(next)}`:`${nt("now")}, ${stepText(next)}`)}
  // 지도 카메라
  if(nmap&&nmarker){
    const at=pr.d<55?{lat:pr.lat,lon:pr.lon}:pos;
    nmarker.setLngLat([at.lon,at.lat]).setRotation(pr.brg);
    nmap.easeTo({center:[at.lon,at.lat],bearing:pr.brg,pitch:60,zoom:toMan<200?17.5:16.5,duration:950,padding:{top:180,bottom:120}});
  }
}
function placeInfo(){
  const h=document.querySelector(".nb").getBoundingClientRect().bottom;
  $("nLanes").style.top=(h-4)+"px";
  const lh=$("nLanes").innerHTML?$("nLanes").getBoundingClientRect().height:0;
  $("nThen").style.top=(h+lh+6)+"px";
}

function arrive(){
  const d=nav.dest,i=nav.i;stopNav();nav={i,dest:d,done:true};
  $("nArrName").textContent=d.isEnd?t("backHome"):(d.name||d.addr);
  $("nDoneNext").style.display=d.isEnd?"none":"";
  $("nArrive").classList.remove("hidden");
  speak(nt("arrived"));
}

$("nEnd").onclick=()=>{stopNav();$("nav").classList.add("hidden");render()};
$("nClose").onclick=()=>{stopNav();nav=null;$("nav").classList.add("hidden");render()};
$("nVoice").onclick=()=>{voiceOn=!voiceOn;store.set("rc_voice",voiceOn);$("nVoice").textContent=voiceOn?"🔊":"🔇";if(!voiceOn)try{speechSynthesis.cancel()}catch(e){}};
$("nVoice").textContent=voiceOn?"🔊":"🔇";
$("nDoneNext").onclick=()=>{
  const i=nav?nav.i:-1;nav=null;
  if(i>=0&&trip.stops[i])trip.stops[i].done=true;store.set("rc_trip",trip);
  const n=trip.stops.findIndex(s=>!s.done);
  if(n<0){$("nav").classList.add("hidden");render();speak(nt("allDone"));return}
  startNav(n,false);
};
window.addEventListener("resize",()=>{if(nmap)nmap.resize()});

// 입력값 기억
$("stops").value=store.get("rc_stops","");$("start").value=store.get("rc_start","");
$("stops").addEventListener("input",e=>store.set("rc_stops",e.target.value));
$("start").addEventListener("input",e=>store.set("rc_start",e.target.value));
applyLang();
if(trip)render();
</script>
